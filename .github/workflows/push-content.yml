name: Push content

on:
  workflow_dispatch:
  push:
    branches:
      - '202[0-9].[0-9]' # generic pattern for release branches like 2024.1, 2025.2, etc.
    paths:
      - 'modules/**'
      - 'antora.yml'
      - '.github/workflows/push-content.yml'

jobs:
  triggerJob:
    uses: bonitasoft/bonita-documentation-site/.github/workflows/_reusable_notify_content_change.yml@master
    secrets: inherit
    with:
        component: 'bonita'
